# CI Pipeline — Agent Workspace
#
# Runs on every push and PR to main.
# Tier 1: build + test + lint
# Tier 2+: add security scanning
# Tier 3: add approval gates (configured in branch protection)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16-alpine, verified as PostgreSQL 16.15 on 2026-09-11.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: etf_analyzer
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etf_analyzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ETF_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/etf_analyzer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: WP-8 coverage gate
        run: npm run test:coverage:wp8

  browser-accessibility:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install dependencies
        run: npm ci

      - name: Browser accessibility test
        run: npm run test:browser

  # Tier 2+: Dependency audit
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Secret pattern scan
        run: |
          ! git grep -nE '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|Account[K]ey=|SharedAccess[K]ey=|Client[S]ecret=)' -- ':!package-lock.json'

      - name: SAST guardrail scan
        run: |
          ! git grep -nE '(exec\(|spawn\(|execSync\(|eval\(|new Function\(|curl .*[|] *sh|Invoke-Expression)' -- src ':!src/**/*.test.ts'
