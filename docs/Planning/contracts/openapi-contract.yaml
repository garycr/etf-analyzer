x-etf-conformance-plan: CT-API-001A..L
x-etf-implementation-status: not-started
x-etf-loopback-only: true
x-etf-allowed-hosts: [127.0.0.1]
x-etf-origin-policy: configured-local-workbench-origins-only
x-etf-reject-duplicate-json-members: true
x-etf-request-body-limit: finite-and-configured
x-etf-no-http-202: true
x-etf-no-callbacks-webhooks-events-or-provider-egress: true
x-etf-conformance-profile:
  genericToolingScope: OpenAPI-and-JSON-Schema-structure-only
  additionalNormativeValidationRequired: true
  requestBodyLimitBytes: 1048576
  jsonDecoding: UTF-8-reject-invalid-and-duplicate-members
  allowedHost: 127.0.0.1:<configured-port>
  allowedOrigins: configured-local-workbench-origins-only
  cors:
    methods: [GET, POST, PUT, DELETE]
    headers: [Content-Type, Accept, X-Request-ID, X-Correlation-ID, X-Requested-At, Idempotency-Key]
    credentials: false
    wildcard: false
  injectedApplicationFields:
    actorId: local-user
    prototypeCandidate: v1.0.0-prototype.1
    contractVersion: 1.0.0-candidate.2
  queryIdempotencyKey: reject-before-dispatch
  ownerImportValidation:
    authority: docs/Planning/contracts/analytics-evidence-contract.md@1.0.0-candidate.2
    failure: reject-before-response
    comparison: Unicode-code-point
    rules:
      - { schema: AnalyticsResult, collectionJsonPointer: /signals, uniqueBy: [/instrumentId], ascendingBy: [/instrumentId] }
      - { schema: AnalyticsResult, collectionJsonPointer: /trades, uniqueBy: [/tradeOrdinal], ascendingContiguousUIntBy: /tradeOrdinal, firstValue: '0' }
      - { schema: AnalyticsResult, collectionJsonPointer: /metrics, uniqueBy: [/metricId], ascendingBy: [/metricId] }
      - { schema: AnalyticsResult, collectionJsonPointer: /warnings, uniqueBy: [/warningCode, /subjectId], ascendingBy: [/subjectId, /warningCode], nulls: first }
